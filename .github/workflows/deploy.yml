name: Frontend CI/CD

# NOTE: repo root IS the Next.js app (package.json lives beside .github/).
# Do NOT add `frontend/**` path filters or `working-directory: frontend` —
# that silently stops this workflow from ever triggering.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deploy environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production
      force_rollback:
        description: "Force rollback to previous version"
        required: false
        type: boolean
        default: false
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9"

jobs:
  # ── Resolve target environment (staging | production) ─────────
  # Outputs ONLY the environment name. Secrets are NEVER passed
  # through job outputs — downstream jobs read secrets directly.
  resolve-env:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
    steps:
      - name: Resolve environment
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            ENV="production"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            ENV="production"
          else
            ENV="staging"
          fi
          echo "environment=$ENV" >> "$GITHUB_OUTPUT"
          echo "Target environment: $ENV"

  # ── Lint + type check ─────────────────────────────────────────
  lint:
    needs: [resolve-env]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      # This repo currently has no ESLint config. The old
      # `npx eslint src/ --ext .ts,.tsx` ALWAYS failed
      # (--ext was removed in ESLint v9). Run lint only when
      # a config exists; otherwise skip with a clear message.
      - name: Lint (if configured)
        run: |
          if [ -f "eslint.config.js" ] || [ -f "eslint.config.mjs" ] || [ -f "eslint.config.cjs" ] || [ -f ".eslintrc.json" ] || [ -f ".eslintrc.js" ] || [ -f ".eslintrc" ]; then
            pnpm exec eslint . --max-warnings 0
          else
            echo "No ESLint config found — skipping lint."
          fi

  # ── Build (validation) ────────────────────────────────────────
  # IMPORTANT: lib/config.ts only accepts NEXT_PUBLIC_APP_ENV =
  # "local" | "production". "staging" FAILS the build, so staging
  # builds also use APP_ENV=production — only the API URL differs.
  build:
    needs: [lint, resolve-env]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_APP_ENV: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      # Resolve NEXT_PUBLIC_API_URL in plain shell (no complex workflow
      # expressions): secrets first; fixed production default only when
      # secrets are empty AND the target is production. Staging stays
      # strict — it fails loudly instead of silently pointing at prod data.
      # Never hardcode this in app source — lib/config.ts reads it at build time.
      - name: Resolve public build env
        run: |
          if [ "${{ needs.resolve-env.outputs.environment }}" = "production" ]; then
            API_URL="${{ secrets.BACKEND_URL }}"
            if [ -z "$API_URL" ]; then
              API_URL="https://server.shohojhisab.com"
              echo "::warning::BACKEND_URL secret is empty — using default production API URL."
            fi
          else
            API_URL="${{ secrets.BACKEND_URL_STAGING }}"
            [ -n "$API_URL" ] || API_URL="${{ secrets.BACKEND_URL }}"
            if [ -z "$API_URL" ]; then
              echo "::error::Staging API URL is empty — set BACKEND_URL_STAGING (or BACKEND_URL) secret."
              exit 1
            fi
          fi
          echo "NEXT_PUBLIC_API_URL=$API_URL" >> "$GITHUB_ENV"
          echo "API URL resolved for ${{ needs.resolve-env.outputs.environment }} build."

      - name: Build
        run: pnpm build

  # ── Deploy to DigitalOcean via SSH ────────────────────────────
  # Strategy: update the existing checkout in the live folder
  # (~/pos/POS for production), reinstall, rebuild ON the server
  # (NEXT_PUBLIC_* vars are baked at build time), then pm2 restart.
  # PRs never reach this job.
  deploy:
    needs: [resolve-env, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'release' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && github.event.inputs.force_rollback != 'true'
    environment: ${{ needs.resolve-env.outputs.environment }}
    env:
      TARGET_ENV: ${{ needs.resolve-env.outputs.environment }}
      DO_PORT: ${{ secrets.DO_PORT }}
      DO_USER: ${{ secrets.DO_USER }}
    steps:
      # Resolve every environment-specific value in plain shell and publish a
      # SET/MISSING + source table to the job summary BEFORE validation, so a
      # missing secret is always diagnosable — even when this job then fails.
      # Secret VALUES are never printed, only names and SET/MISSING status.
      # Secret names and production defaults come from SECRETS.md.
      - name: Resolve deployment configuration
        run: |
          status_of() { if [ -n "$1" ]; then echo "SET"; else echo "MISSING"; fi; }

          if [ "$TARGET_ENV" = "production" ]; then
            BACKEND_URL_RESOLVED="${{ secrets.BACKEND_URL }}"
            BACKEND_SRC="BACKEND_URL"
            if [ -z "$BACKEND_URL_RESOLVED" ]; then
              BACKEND_URL_RESOLVED="https://server.shohojhisab.com"
              BACKEND_SRC="DEFAULT"
              echo "::warning::BACKEND_URL secret is empty — using default production backend URL."
            fi
            FRONTEND_URL_RESOLVED="${{ secrets.FRONTEND_URL }}"
            FRONTEND_SRC="FRONTEND_URL"
            if [ -z "$FRONTEND_URL_RESOLVED" ]; then
              FRONTEND_URL_RESOLVED="https://shohojhisab.com"
              FRONTEND_SRC="DEFAULT"
              echo "::warning::FRONTEND_URL secret is empty — using default production frontend URL."
            fi
            DO_HOST_RESOLVED="${{ secrets.DO_HOST }}"
            DO_HOST_SRC="DO_HOST"
          else
            BACKEND_URL_RESOLVED="${{ secrets.BACKEND_URL_STAGING }}"
            BACKEND_SRC="BACKEND_URL_STAGING"
            [ -n "$BACKEND_URL_RESOLVED" ] || { BACKEND_URL_RESOLVED="${{ secrets.BACKEND_URL }}"; BACKEND_SRC="BACKEND_URL"; }
            FRONTEND_URL_RESOLVED="${{ secrets.FRONTEND_URL_STAGING }}"
            FRONTEND_SRC="FRONTEND_URL_STAGING"
            [ -n "$FRONTEND_URL_RESOLVED" ] || { FRONTEND_URL_RESOLVED="${{ secrets.FRONTEND_URL }}"; FRONTEND_SRC="FRONTEND_URL"; }
            DO_HOST_RESOLVED="${{ secrets.DO_HOST_STAGING }}"
            DO_HOST_SRC="DO_HOST_STAGING"
            [ -n "$DO_HOST_RESOLVED" ] || { DO_HOST_RESOLVED="${{ secrets.DO_HOST }}"; DO_HOST_SRC="DO_HOST"; }
          fi

          {
            echo "BACKEND_URL_RESOLVED=$BACKEND_URL_RESOLVED"
            echo "FRONTEND_URL_RESOLVED=$FRONTEND_URL_RESOLVED"
            echo "DO_HOST_RESOLVED=$DO_HOST_RESOLVED"
          } >> "$GITHUB_ENV"

          {
            echo "## Deployment Configuration ($TARGET_ENV)"
            echo ""
            echo "| Configuration | Status | Source |"
            echo "| ------------- | ------ | ------ |"
            echo "| TARGET_ENV | $(status_of "$TARGET_ENV") | resolve-env |"
            echo "| BACKEND_URL | $(status_of "$BACKEND_URL_RESOLVED") | $BACKEND_SRC |"
            echo "| FRONTEND_URL | $(status_of "$FRONTEND_URL_RESOLVED") | $FRONTEND_SRC |"
            echo "| DO_HOST | $(status_of "$DO_HOST_RESOLVED") | $DO_HOST_SRC |"
            echo "| DO_PORT | $(status_of "$DO_PORT") | DO_PORT |"
            echo "| DO_USER | $(status_of "$DO_USER") | DO_USER |"
            echo "| DO_SSH_KEY | $(status_of "${{ secrets.DO_SSH_KEY }}") | DO_SSH_KEY |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate secrets
        run: |
          MISSING=""
          if [ "$TARGET_ENV" = "production" ]; then
            [ -n "$BACKEND_URL_RESOLVED" ]  || MISSING="$MISSING BACKEND_URL"
            [ -n "$FRONTEND_URL_RESOLVED" ] || MISSING="$MISSING FRONTEND_URL"
            [ -n "$DO_HOST_RESOLVED" ]      || MISSING="$MISSING DO_HOST"
          else
            [ -n "$BACKEND_URL_RESOLVED" ]  || MISSING="$MISSING BACKEND_URL_STAGING"
            [ -n "$FRONTEND_URL_RESOLVED" ] || MISSING="$MISSING FRONTEND_URL_STAGING"
            [ -n "$DO_HOST_RESOLVED" ]      || MISSING="$MISSING DO_HOST_STAGING"
          fi
          [ -n "$DO_PORT" ] || MISSING="$MISSING DO_PORT"
          [ -n "$DO_USER" ] || MISSING="$MISSING DO_USER"
          [ -n "${{ secrets.DO_SSH_KEY }}" ] || MISSING="$MISSING DO_SSH_KEY"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing GitHub secrets for $TARGET_ENV:$MISSING (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          echo "Secrets OK for environment: $TARGET_ENV"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' '${{ secrets.DO_SSH_KEY }}' > ~/.ssh/digitalocean
          chmod 600 ~/.ssh/digitalocean
          # ssh-keyscan is best-effort: it pre-populates known_hosts so the next
          # step can SSH non-interactively. If it fails, the ssh step itself will
          # fail loudly — this line is intentionally non-fatal.
          ssh-keyscan -p "${DO_PORT:-22}" "$DO_HOST_RESOLVED" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy to droplet
        run: |
          ssh -i ~/.ssh/digitalocean -p "${DO_PORT:-22}" \
            "$DO_USER@$DO_HOST_RESOLVED" \
            "TARGET_ENV='$TARGET_ENV' BACKEND_URL_RESOLVED='$BACKEND_URL_RESOLVED' GIT_SHA='$GITHUB_SHA' bash -s" <<'REMOTE_EOF'
          set -euo pipefail

          if [ "$TARGET_ENV" = "production" ]; then
            APP_DIR="$HOME/pos/POS"
            PM2_NAME="frontend"
            BRANCH="main"
          else
            APP_DIR="$HOME/pos/POS-staging"
            PM2_NAME="frontend-staging"
            BRANCH="develop"
          fi

          # Live folder must be a git checkout of this repo.
          if [ ! -d "$APP_DIR/.git" ]; then
            echo "No git checkout at $APP_DIR — cloning branch $BRANCH..."
            git clone --branch "$BRANCH" "git@github.com:${GITHUB_REPOSITORY}.git" "$APP_DIR"
          fi
          cd "$APP_DIR"

          git fetch --all --prune
          if git cat-file -e "$GIT_SHA^{commit}" 2>/dev/null; then
            git reset --hard "$GIT_SHA"
          else
            echo "::error::SHA $GIT_SHA not found on the droplet — aborting deploy instead of falling back to origin/$BRANCH."
            exit 1
          fi

          export NVM_DIR="$HOME/.nvm"
          if [ -s "$NVM_DIR/nvm.sh" ]; then
            # shellcheck disable=SC1091
            . "$NVM_DIR/nvm.sh"
          fi
          corepack enable
          corepack prepare pnpm@9 --activate

          pnpm install --frozen-lockfile

          # NEXT_PUBLIC_* is embedded at build time — must be set here.
          # APP_ENV stays "production" (lib/config.ts rejects "staging").
          export NEXT_PUBLIC_APP_ENV="production"
          export NEXT_PUBLIC_API_URL="$BACKEND_URL_RESOLVED"
          export NODE_OPTIONS="--max-old-space-size=1536"
          pnpm build

          if pm2 describe "$PM2_NAME" >/dev/null 2>&1; then
            pm2 restart "$PM2_NAME" --update-env
          else
            if [ "$TARGET_ENV" = "production" ]; then
              pm2 start pnpm --name "$PM2_NAME" -- exec next start --port 3020
            else
              pm2 start pnpm --name "$PM2_NAME" -- exec next start --port 3021
            fi
          fi
          pm2 save
          pm2 list
          REMOTE_EOF

      - name: Verify deployment
        run: |
          echo "Waiting for $FRONTEND_URL_RESOLVED ..."
          VERIFIED=""
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 10 "$FRONTEND_URL_RESOLVED" >/dev/null; then
              echo "Frontend healthy at $FRONTEND_URL_RESOLVED"
              VERIFIED="yes"
              break
            fi
            echo "Attempt $i/6 not ready yet, retrying in 10s..."
            sleep 10
          done
          if [ -z "$VERIFIED" ]; then
            echo "::error::Frontend not reachable at $FRONTEND_URL_RESOLVED after 60s"
            exit 1
          fi

          # Only a SUCCESSFULLY VERIFIED deployment may update the marker.
          # .deployed-sha = last verified OK; .deployed-sha.prev = the one before.
          ssh -i ~/.ssh/digitalocean -p "${DO_PORT:-22}" \
            "$DO_USER@$DO_HOST_RESOLVED" \
            "TARGET_ENV='$TARGET_ENV' GIT_SHA='${{ github.sha }}' bash -s" <<'REMOTE_EOF'
          set -euo pipefail

          if [ "$TARGET_ENV" = "production" ]; then
            APP_DIR="$HOME/pos/POS"
          else
            APP_DIR="$HOME/pos/POS-staging"
          fi
          PREV_SHA="$(cat "$APP_DIR/.deployed-sha" 2>/dev/null || true)"
          if [ -n "$PREV_SHA" ] && [ "$PREV_SHA" != "$GIT_SHA" ]; then
            echo "$PREV_SHA" > "$APP_DIR/.deployed-sha.prev"
          fi
          echo "$GIT_SHA" > "$APP_DIR/.deployed-sha"
          echo "Recorded $GIT_SHA as last verified deployment."
          REMOTE_EOF

  # ── Rollback (manual only) ────────────────────────────────────
  rollback:
    needs: [resolve-env]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.force_rollback == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ needs.resolve-env.outputs.environment }}
    env:
      TARGET_ENV: ${{ needs.resolve-env.outputs.environment }}
      DO_PORT: ${{ secrets.DO_PORT }}
      DO_USER: ${{ secrets.DO_USER }}
    steps:
      - name: Resolve deployment configuration
        run: |
          status_of() { if [ -n "$1" ]; then echo "SET"; else echo "MISSING"; fi; }

          if [ "$TARGET_ENV" = "production" ]; then
            BACKEND_URL_RESOLVED="${{ secrets.BACKEND_URL }}"
            BACKEND_SRC="BACKEND_URL"
            if [ -z "$BACKEND_URL_RESOLVED" ]; then
              BACKEND_URL_RESOLVED="https://server.shohojhisab.com"
              BACKEND_SRC="DEFAULT"
              echo "::warning::BACKEND_URL secret is empty — using default production backend URL."
            fi
            FRONTEND_URL_RESOLVED="${{ secrets.FRONTEND_URL }}"
            FRONTEND_SRC="FRONTEND_URL"
            if [ -z "$FRONTEND_URL_RESOLVED" ]; then
              FRONTEND_URL_RESOLVED="https://shohojhisab.com"
              FRONTEND_SRC="DEFAULT"
              echo "::warning::FRONTEND_URL secret is empty — using default production frontend URL."
            fi
            DO_HOST_RESOLVED="${{ secrets.DO_HOST }}"
            DO_HOST_SRC="DO_HOST"
          else
            BACKEND_URL_RESOLVED="${{ secrets.BACKEND_URL_STAGING }}"
            BACKEND_SRC="BACKEND_URL_STAGING"
            [ -n "$BACKEND_URL_RESOLVED" ] || { BACKEND_URL_RESOLVED="${{ secrets.BACKEND_URL }}"; BACKEND_SRC="BACKEND_URL"; }
            FRONTEND_URL_RESOLVED="${{ secrets.FRONTEND_URL_STAGING }}"
            FRONTEND_SRC="FRONTEND_URL_STAGING"
            [ -n "$FRONTEND_URL_RESOLVED" ] || { FRONTEND_URL_RESOLVED="${{ secrets.FRONTEND_URL }}"; FRONTEND_SRC="FRONTEND_URL"; }
            DO_HOST_RESOLVED="${{ secrets.DO_HOST_STAGING }}"
            DO_HOST_SRC="DO_HOST_STAGING"
            [ -n "$DO_HOST_RESOLVED" ] || { DO_HOST_RESOLVED="${{ secrets.DO_HOST }}"; DO_HOST_SRC="DO_HOST"; }
          fi

          {
            echo "BACKEND_URL_RESOLVED=$BACKEND_URL_RESOLVED"
            echo "FRONTEND_URL_RESOLVED=$FRONTEND_URL_RESOLVED"
            echo "DO_HOST_RESOLVED=$DO_HOST_RESOLVED"
          } >> "$GITHUB_ENV"

          {
            echo "## Deployment Configuration ($TARGET_ENV)"
            echo ""
            echo "| Configuration | Status | Source |"
            echo "| ------------- | ------ | ------ |"
            echo "| TARGET_ENV | $(status_of "$TARGET_ENV") | resolve-env |"
            echo "| BACKEND_URL | $(status_of "$BACKEND_URL_RESOLVED") | $BACKEND_SRC |"
            echo "| FRONTEND_URL | $(status_of "$FRONTEND_URL_RESOLVED") | $FRONTEND_SRC |"
            echo "| DO_HOST | $(status_of "$DO_HOST_RESOLVED") | $DO_HOST_SRC |"
            echo "| DO_PORT | $(status_of "$DO_PORT") | DO_PORT |"
            echo "| DO_USER | $(status_of "$DO_USER") | DO_USER |"
            echo "| DO_SSH_KEY | $(status_of "${{ secrets.DO_SSH_KEY }}") | DO_SSH_KEY |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' '${{ secrets.DO_SSH_KEY }}' > ~/.ssh/digitalocean
          chmod 600 ~/.ssh/digitalocean
          # ssh-keyscan is best-effort: it pre-populates known_hosts so the next
          # step can SSH non-interactively. If it fails, the ssh step itself will
          # fail loudly — this line is intentionally non-fatal.
          ssh-keyscan -p "${DO_PORT:-22}" "$DO_HOST_RESOLVED" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Rollback to previous commit
        run: |
          ssh -i ~/.ssh/digitalocean -p "${DO_PORT:-22}" \
            "$DO_USER@$DO_HOST_RESOLVED" \
            "TARGET_ENV='$TARGET_ENV' BACKEND_URL_RESOLVED='$BACKEND_URL_RESOLVED' FRONTEND_URL_RESOLVED='$FRONTEND_URL_RESOLVED' bash -s" <<'REMOTE_EOF'
          set -euo pipefail

          if [ "$TARGET_ENV" = "production" ]; then
            APP_DIR="$HOME/pos/POS"
            PM2_NAME="frontend"
          else
            APP_DIR="$HOME/pos/POS-staging"
            PM2_NAME="frontend-staging"
          fi
          cd "$APP_DIR"

          PREV_SHA="$(cat "$APP_DIR/.deployed-sha.prev" 2>/dev/null || true)"
          if [ -z "$PREV_SHA" ] || ! git cat-file -e "$PREV_SHA^{commit}" 2>/dev/null; then
            echo "::error::No recorded previously-successful deployment SHA at $APP_DIR/.deployed-sha.prev — refusing to guess (HEAD~1 is not a safe rollback target)."
            exit 1
          fi
          echo "Rolling back to previously-successful SHA $PREV_SHA ..."
          git reset --hard "$PREV_SHA"

          export NVM_DIR="$HOME/.nvm"
          if [ -s "$NVM_DIR/nvm.sh" ]; then
            # shellcheck disable=SC1091
            . "$NVM_DIR/nvm.sh"
          fi
          corepack enable
          corepack prepare pnpm@9 --activate

          pnpm install --frozen-lockfile
          export NEXT_PUBLIC_APP_ENV="production"
          export NEXT_PUBLIC_API_URL="$BACKEND_URL_RESOLVED"
          export NODE_OPTIONS="--max-old-space-size=1536"
          pnpm build
          pm2 restart "$PM2_NAME" --update-env
          pm2 save
          # Wait for the frontend to come back on the rolled-back build before
          # declaring success or updating the deployment marker.
          VERIFIED=""
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 10 "$FRONTEND_URL_RESOLVED" >/dev/null; then
              VERIFIED="yes"
              break
            fi
            echo "Attempt $i/6 not ready yet, retrying in 10s..."
            sleep 10
          done
          if [ -z "$VERIFIED" ]; then
            echo "::error::Frontend not reachable at $FRONTEND_URL_RESOLVED after rollback — NOT updating deployment marker."
            exit 1
          fi
          # Rollback verified — record it as the current deployment.
          echo "$PREV_SHA" > "$APP_DIR/.deployed-sha"
          rm -f "$APP_DIR/.deployed-sha.prev"
          echo "Rolled back to $PREV_SHA"
          REMOTE_EOF

  # ── Summary ───────────────────────────────────────────────────
  summary:
    needs: [resolve-env, lint, build, deploy, rollback]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: CI/CD Summary
        run: |
          echo "## Frontend CI/CD Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | ${{ needs.resolve-env.outputs.environment }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Ref | ${{ github.ref }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SHA | ${{ github.sha }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Lint | ${{ needs.lint.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build | ${{ needs.build.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Deploy | ${{ needs.deploy.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Rollback | ${{ needs.rollback.result }} |" >> "$GITHUB_STEP_SUMMARY"
