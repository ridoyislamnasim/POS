name: Frontend CI/CD

# NOTE: repo root IS the Next.js app (package.json lives beside .github/).
# Do NOT add `frontend/**` path filters or `working-directory: frontend` —
# that silently stops this workflow from ever triggering.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deploy environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production
      force_rollback:
        description: "Force rollback to previous version"
        required: false
        type: boolean
        default: false
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9"
  # Fixed production backend origin (no trailing /api). Last-resort default
  # ONLY for production builds when the BACKEND_URL secret is empty.
  # Secrets always win when present. Never hardcode this in app source —
  # lib/config.ts reads it from NEXT_PUBLIC_API_URL at build time.
  PRODUCTION_BACKEND_URL: "https://server.shohojhisab.com"

jobs:
  # ── Resolve target environment (staging | production) ─────────
  # Outputs ONLY the environment name. Secrets are NEVER passed
  # through job outputs — downstream jobs read secrets directly.
  resolve-env:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
    steps:
      - name: Resolve environment
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            ENV="production"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            ENV="production"
          else
            ENV="staging"
          fi
          echo "environment=$ENV" >> "$GITHUB_OUTPUT"
          echo "Target environment: $ENV"

  # ── Lint + type check ─────────────────────────────────────────
  lint:
    needs: [resolve-env]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      # This repo currently has no ESLint config. The old
      # `npx eslint src/ --ext .ts,.tsx` ALWAYS failed
      # (--ext was removed in ESLint v9). Run lint only when
      # a config exists; otherwise skip with a clear message.
      - name: Lint (if configured)
        run: |
          if [ -f "eslint.config.js" ] || [ -f "eslint.config.mjs" ] || [ -f "eslint.config.cjs" ] || [ -f ".eslintrc.json" ] || [ -f ".eslintrc.js" ] || [ -f ".eslintrc" ]; then
            pnpm exec eslint . --max-warnings 0
          else
            echo "No ESLint config found — skipping lint."
          fi

  # ── Build (validation) ────────────────────────────────────────
  # IMPORTANT: lib/config.ts only accepts NEXT_PUBLIC_APP_ENV =
  # "local" | "production". "staging" FAILS the build, so staging
  # builds also use APP_ENV=production — only the API URL differs.
  build:
    needs: [lint, resolve-env]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_APP_ENV: production
      # Secrets first; fixed production default only when secrets are empty AND
      # the target is production. Staging stays strict — it fails loudly with
      # the [api-config] error instead of silently pointing at production data.
      NEXT_PUBLIC_API_URL: ${{ (needs.resolve-env.outputs.environment == 'production' && secrets.BACKEND_URL) || secrets.BACKEND_URL_STAGING || secrets.BACKEND_URL || (needs.resolve-env.outputs.environment == 'production' && env.PRODUCTION_BACKEND_URL) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm build

  # ── Deploy to DigitalOcean via SSH ────────────────────────────
  # Strategy: update the existing checkout in the live folder
  # (~/pos/POS for production), reinstall, rebuild ON the server
  # (NEXT_PUBLIC_* vars are baked at build time), then pm2 restart.
  # PRs never reach this job.
  deploy:
    needs: [resolve-env, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'release' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && github.event.inputs.force_rollback != 'true'
    environment: ${{ needs.resolve-env.outputs.environment }}
    env:
      TARGET_ENV: ${{ needs.resolve-env.outputs.environment }}
      BACKEND_URL_RESOLVED: ${{ (needs.resolve-env.outputs.environment == 'production' && secrets.BACKEND_URL) || secrets.BACKEND_URL_STAGING || secrets.BACKEND_URL || (needs.resolve-env.outputs.environment == 'production' && env.PRODUCTION_BACKEND_URL) }}
      FRONTEND_URL_RESOLVED: ${{ needs.resolve-env.outputs.environment == 'production' && secrets.FRONTEND_URL || secrets.FRONTEND_URL_STAGING || secrets.FRONTEND_URL }}
      DO_HOST_RESOLVED: ${{ needs.resolve-env.outputs.environment == 'production' && secrets.DO_HOST || secrets.DO_HOST_STAGING || secrets.DO_HOST }}
      DO_PORT: ${{ secrets.DO_PORT }}
      DO_USER: ${{ secrets.DO_USER }}
    steps:
      - name: Validate secrets
        run: |
          MISSING=""
          [ -n "$BACKEND_URL_RESOLVED" ]  || MISSING="$MISSING BACKEND_URL(_STAGING)"
          [ -n "$FRONTEND_URL_RESOLVED" ] || MISSING="$MISSING FRONTEND_URL(_STAGING)"
          [ -n "$DO_HOST_RESOLVED" ]      || MISSING="$MISSING DO_HOST(_STAGING)"
          [ -n "${{ secrets.DO_SSH_KEY }}" ] || MISSING="$MISSING DO_SSH_KEY"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing GitHub secrets:$MISSING (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          echo "Secrets OK for environment: $TARGET_ENV"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' '${{ secrets.DO_SSH_KEY }}' > ~/.ssh/digitalocean
          chmod 600 ~/.ssh/digitalocean
          ssh-keyscan -p "${DO_PORT:-22}" "$DO_HOST_RESOLVED" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy to droplet
        run: |
          ssh -i ~/.ssh/digitalocean -p "${DO_PORT:-22}" \
            "$DO_USER@$DO_HOST_RESOLVED" \
            "TARGET_ENV='$TARGET_ENV' BACKEND_URL_RESOLVED='$BACKEND_URL_RESOLVED' GIT_SHA='$GITHUB_SHA' bash -s" <<'REMOTE_EOF'
          set -euo pipefail

          if [ "$TARGET_ENV" = "production" ]; then
            APP_DIR="$HOME/pos/POS"
            PM2_NAME="frontend"
            BRANCH="main"
          else
            APP_DIR="$HOME/pos/POS-staging"
            PM2_NAME="frontend-staging"
            BRANCH="develop"
          fi

          # Live folder must be a git checkout of this repo.
          if [ ! -d "$APP_DIR/.git" ]; then
            echo "No git checkout at $APP_DIR — cloning branch $BRANCH..."
            git clone --branch "$BRANCH" "git@github.com:${GITHUB_REPOSITORY}.git" "$APP_DIR"
          fi
          cd "$APP_DIR"

          git fetch --all --prune
          if git cat-file -e "$GIT_SHA^{commit}" 2>/dev/null; then
            git reset --hard "$GIT_SHA"
          else
            echo "SHA $GIT_SHA not found on droplet — deploying origin/$BRANCH instead."
            git reset --hard "origin/$BRANCH"
          fi

          export NVM_DIR="$HOME/.nvm"
          if [ -s "$NVM_DIR/nvm.sh" ]; then
            # shellcheck disable=SC1091
            . "$NVM_DIR/nvm.sh"
          fi
          corepack enable || true
          corepack prepare pnpm@9 --activate || true

          pnpm install --frozen-lockfile

          # NEXT_PUBLIC_* is embedded at build time — must be set here.
          # APP_ENV stays "production" (lib/config.ts rejects "staging").
          export NEXT_PUBLIC_APP_ENV="production"
          export NEXT_PUBLIC_API_URL="$BACKEND_URL_RESOLVED"
          export NODE_OPTIONS="--max-old-space-size=1536"
          pnpm build

          if pm2 describe "$PM2_NAME" >/dev/null 2>&1; then
            pm2 restart "$PM2_NAME" --update-env
          else
            if [ "$TARGET_ENV" = "production" ]; then
              pm2 start pnpm --name "$PM2_NAME" -- start
            else
              pm2 start pnpm --name "$PM2_NAME" -- exec next start --port 3021
            fi
          fi
          pm2 save || true
          pm2 list
          REMOTE_EOF

      - name: Verify deployment
        run: |
          echo "Waiting for $FRONTEND_URL_RESOLVED ..."
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 10 "$FRONTEND_URL_RESOLVED" >/dev/null; then
              echo "Frontend healthy at $FRONTEND_URL_RESOLVED"
              exit 0
            fi
            echo "Attempt $i/6 not ready yet, retrying in 10s..."
            sleep 10
          done
          echo "::error::Frontend not reachable at $FRONTEND_URL_RESOLVED after 60s"
          exit 1

  # ── Rollback (manual only) ────────────────────────────────────
  rollback:
    needs: [resolve-env]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.force_rollback == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ needs.resolve-env.outputs.environment }}
    env:
      TARGET_ENV: ${{ needs.resolve-env.outputs.environment }}
      BACKEND_URL_RESOLVED: ${{ (needs.resolve-env.outputs.environment == 'production' && secrets.BACKEND_URL) || secrets.BACKEND_URL_STAGING || secrets.BACKEND_URL || (needs.resolve-env.outputs.environment == 'production' && env.PRODUCTION_BACKEND_URL) }}
      DO_HOST_RESOLVED: ${{ needs.resolve-env.outputs.environment == 'production' && secrets.DO_HOST || secrets.DO_HOST_STAGING || secrets.DO_HOST }}
      DO_PORT: ${{ secrets.DO_PORT }}
      DO_USER: ${{ secrets.DO_USER }}
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' '${{ secrets.DO_SSH_KEY }}' > ~/.ssh/digitalocean
          chmod 600 ~/.ssh/digitalocean
          ssh-keyscan -p "${DO_PORT:-22}" "$DO_HOST_RESOLVED" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Rollback to previous commit
        run: |
          ssh -i ~/.ssh/digitalocean -p "${DO_PORT:-22}" \
            "$DO_USER@$DO_HOST_RESOLVED" \
            "TARGET_ENV='$TARGET_ENV' BACKEND_URL_RESOLVED='$BACKEND_URL_RESOLVED' bash -s" <<'REMOTE_EOF'
          set -euo pipefail

          if [ "$TARGET_ENV" = "production" ]; then
            APP_DIR="$HOME/pos/POS"
            PM2_NAME="frontend"
          else
            APP_DIR="$HOME/pos/POS-staging"
            PM2_NAME="frontend-staging"
          fi
          cd "$APP_DIR"

          PREV_SHA="$(git rev-parse HEAD~1)"
          echo "Rolling back to $PREV_SHA ..."
          git reset --hard "$PREV_SHA"

          export NVM_DIR="$HOME/.nvm"
          if [ -s "$NVM_DIR/nvm.sh" ]; then
            # shellcheck disable=SC1091
            . "$NVM_DIR/nvm.sh"
          fi
          corepack enable || true
          corepack prepare pnpm@9 --activate || true

          pnpm install --frozen-lockfile
          export NEXT_PUBLIC_APP_ENV="production"
          export NEXT_PUBLIC_API_URL="$BACKEND_URL_RESOLVED"
          export NODE_OPTIONS="--max-old-space-size=1536"
          pnpm build
          pm2 restart "$PM2_NAME" --update-env
          pm2 save || true
          echo "Rolled back to $PREV_SHA"
          REMOTE_EOF

  # ── Summary ───────────────────────────────────────────────────
  summary:
    needs: [resolve-env, lint, build, deploy, rollback]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: CI/CD Summary
        run: |
          echo "## Frontend CI/CD Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | ${{ needs.resolve-env.outputs.environment }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Ref | ${{ github.ref }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SHA | ${{ github.sha }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Lint | ${{ needs.lint.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build | ${{ needs.build.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Deploy | ${{ needs.deploy.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Rollback | ${{ needs.rollback.result }} |" >> "$GITHUB_STEP_SUMMARY"
