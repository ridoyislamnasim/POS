name: Frontend CI

on:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
    branches: [main, develop]
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deploy environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

concurrency:
  group: frontend-ci-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9"
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  # ── Resolve target environment ──────────────────────────────────────
  resolve-env:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.value }}
      backend_url: ${{ steps.env.outputs.backend_url }}
      do_host: ${{ steps.env.outputs.do_host }}
      do_port: ${{ steps.env.outputs.do_port }}
      do_user: ${{ steps.env.outputs.do_user }}
      frontend_url: ${{ steps.env.outputs.frontend_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            ENV="production"
          elif [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            ENV="staging"
          else
            ENV="staging"
          fi
          echo "value=$ENV" >> "$GITHUB_OUTPUT"
          echo "environment=$ENV" >> "$GITHUB_OUTPUT"

          case "$ENV" in
            production)
              echo "backend_url=${{ secrets.BACKEND_URL }}" >> "$GITHUB_OUTPUT"
              echo "frontend_url=${{ secrets.FRONTEND_URL }}" >> "$GITHUB_OUTPUT"
              echo "do_host=${{ secrets.DO_HOST }}" >> "$GITHUB_OUTPUT"
              echo "do_port=${{ secrets.DO_PORT }}" >> "$GITHUB_OUTPUT"
              echo "do_user=${{ secrets.DO_USER }}" >> "$GITHUB_OUTPUT"
              ;;
            staging)
              echo "backend_url=${{ secrets.BACKEND_URL_STAGING }}" >> "$GITHUB_OUTPUT"
              echo "frontend_url=${{ secrets.FRONTEND_URL_STAGING }}" >> "$GITHUB_OUTPUT"
              echo "do_host=${{ secrets.DO_HOST_STAGING }}" >> "$GITHUB_OUTPUT"
              echo "do_port=${{ secrets.DO_PORT }}" >> "$GITHUB_OUTPUT"
              echo "do_user=${{ secrets.DO_USER }}" >> "$GITHUB_OUTPUT"
              ;;
          esac

  # ── Lint ──────────────────────────────────────────────────────────
  lint:
    needs: [resolve-env]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install
        working-directory: frontend

      - name: Type check
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Lint
        run: npx eslint src/ --ext .ts,.tsx --max-warnings 0
        working-directory: frontend
        continue-on-error: true

  # ── Build ─────────────────────────────────────────────────────────
  build:
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install
        working-directory: frontend

      - name: Type check
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Build
        run: pnpm build
        working-directory: frontend
        env:
          NEXT_PUBLIC_APP_ENV: ${{ needs.resolve-env.outputs.environment }}
          NEXT_PUBLIC_API_URL: ${{ needs.resolve-env.outputs.backend_url }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-${{ needs.resolve-env.outputs.environment }}
          path: frontend/.next/
          retention-days: 5

  # ── Deploy to DigitalOcean ────────────────────────────────────────
  deploy:
    needs: [resolve-env, build]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    environment: ${{ needs.resolve-env.outputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' '${{ secrets.DO_SSH_KEY }}' > ~/.ssh/digitalocean
          chmod 600 ~/.ssh/digitalocean
          ssh-keyscan -p "${{ secrets.DO_PORT }}" "${{ secrets.DO_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build-${{ needs.resolve-env.outputs.environment }}
          path: frontend/.next/

      - name: Deploy frontend to droplet
        shell: bash
        run: |
          ssh -i ~/.ssh/digitalocean -p "${{ secrets.DO_PORT }}" \
            "${{ secrets.DO_USER }}@${{ secrets.DO_HOST }}" \
            "cd ~/app/frontend && \
             corepack enable && \
             corepack prepare pnpm@9 --activate && \
             pnpm install --frozen-lockfile --prod && \
             pm2 restart frontend --update-env || \
             pm2 start server.js --name frontend --update-env"

      - name: Verify deployment
        shell: bash
        run: |
          sleep 3
          curl -sf ${{ secrets.FRONTEND_URL }}/ && \
            echo "Frontend healthy at ${{ secrets.FRONTEND_URL }}" || \
            (echo "Frontend not ready" && exit 1)

  # ── Docker Build & Push ───────────────────────────────────────────
  docker:
    needs: [lint]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install
        working-directory: frontend

      - name: Build frontend
        run: pnpm build
        working-directory: frontend
        env:
          NEXT_PUBLIC_APP_ENV: ${{ needs.resolve-env.outputs.environment }}
          NEXT_PUBLIC_API_URL: ${{ needs.resolve-env.outputs.backend_url }}

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:latest
          build-args: |
            NEXT_PUBLIC_APP_ENV=${{ needs.resolve-env.outputs.environment }}
            NEXT_PUBLIC_API_URL=${{ secrets.BACKEND_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=pos-frontend
            org.opencontainers.image.environment=${{ needs.resolve-env.outputs.environment }}
